<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban Task Board</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .task-card {
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      cursor: grab;
    }
    .task-card:active {
      cursor: grabbing;
    }
    .task-card.dragging {
      opacity: 0.4;
      transform: scale(0.98);
    }
    .column-dropzone.drag-over {
      background-color: rgba(243, 244, 246, 0.9);
      border-color: #6366f1;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

  <!-- Navigation Bar -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-20 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white text-xl font-bold shadow-md shadow-indigo-100">
          📋
        </div>
        <div>
          <h1 class="text-lg font-bold text-slate-900 leading-tight">Kanban Task Board</h1>
          <p class="text-xs text-slate-500">Flask REST API &bull; Lightweight In-Memory Engine</p>
        </div>
      </div>

      <div class="flex items-center space-x-3">
        <!-- Search Input -->
        <div class="relative hidden sm:block">
          <input
            id="searchInput"
            type="text"
            placeholder="Search tasks..."
            class="w-64 pl-9 pr-3 py-1.5 text-sm bg-slate-100 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition"
          />
          <svg class="w-4 h-4 text-slate-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </div>

        <!-- Priority Filter -->
        <select
          id="priorityFilter"
          class="text-sm bg-slate-100 border border-slate-200 rounded-lg px-3 py-1.5 text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500"
        >
          <option value="all">All Priorities</option>
          <option value="high">High Priority</option>
          <option value="medium">Medium Priority</option>
          <option value="low">Low Priority</option>
        </select>

        <!-- New Task Button -->
        <button
          id="openCreateModalBtn"
          class="inline-flex items-center space-x-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm px-4 py-2 rounded-lg shadow-sm transition hover:shadow focus:ring-2 focus:ring-indigo-500 focus:outline-none"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
          </svg>
          <span>New Task</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Metrics Bar -->
  <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 pb-2 w-full">
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-white rounded-xl p-4 border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Total Tasks</span>
          <div id="statTotal" class="text-2xl font-bold text-slate-900 mt-0.5">0</div>
        </div>
        <div class="p-2.5 bg-slate-100 rounded-lg text-slate-600">
          📊
        </div>
      </div>
      <div class="bg-white rounded-xl p-4 border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <span class="text-xs font-semibold text-amber-600 uppercase tracking-wider">To Do</span>
          <div id="statTodo" class="text-2xl font-bold text-slate-900 mt-0.5">0</div>
        </div>
        <div class="p-2.5 bg-amber-50 rounded-lg text-amber-600">
          📝
        </div>
      </div>
      <div class="bg-white rounded-xl p-4 border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <span class="text-xs font-semibold text-blue-600 uppercase tracking-wider">In Progress</span>
          <div id="statInProgress" class="text-2xl font-bold text-slate-900 mt-0.5">0</div>
        </div>
        <div class="p-2.5 bg-blue-50 rounded-lg text-blue-600">
          ⚡
        </div>
      </div>
      <div class="bg-white rounded-xl p-4 border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <span class="text-xs font-semibold text-emerald-600 uppercase tracking-wider">Done</span>
          <div id="statDone" class="text-2xl font-bold text-slate-900 mt-0.5">0</div>
        </div>
        <div class="p-2.5 bg-emerald-50 rounded-lg text-emerald-600">
          ✅
        </div>
      </div>
    </div>
  </section>

  <!-- Kanban Board Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full flex-1">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-start">
      
      <!-- Column 1: To Do -->
      <div class="bg-slate-100 rounded-2xl p-4 border border-slate-200 flex flex-col min-h-[500px]">
        <div class="flex items-center justify-between mb-3 px-1">
          <div class="flex items-center space-x-2">
            <span class="w-3 h-3 rounded-full bg-amber-500"></span>
            <h2 class="font-semibold text-slate-800 text-sm tracking-wide uppercase">To Do</h2>
          </div>
          <span id="badgeTodo" class="bg-slate-200 text-slate-700 text-xs font-bold px-2 py-0.5 rounded-full">0</span>
        </div>

        <div
          id="column-todo"
          data-status="todo"
          class="column-dropzone flex-1 space-y-3 p-1 rounded-xl transition border-2 border-transparent border-dashed min-h-[400px]"
        >
          <!-- Tasks injected here -->
        </div>
      </div>

      <!-- Column 2: In Progress -->
      <div class="bg-slate-100 rounded-2xl p-4 border border-slate-200 flex flex-col min-h-[500px]">
        <div class="flex items-center justify-between mb-3 px-1">
          <div class="flex items-center space-x-2">
            <span class="w-3 h-3 rounded-full bg-blue-500"></span>
            <h2 class="font-semibold text-slate-800 text-sm tracking-wide uppercase">In Progress</h2>
          </div>
          <span id="badgeInProgress" class="bg-slate-200 text-slate-700 text-xs font-bold px-2 py-0.5 rounded-full">0</span>
        </div>

        <div
          id="column-in-progress"
          data-status="in-progress"
          class="column-dropzone flex-1 space-y-3 p-1 rounded-xl transition border-2 border-transparent border-dashed min-h-[400px]"
        >
          <!-- Tasks injected here -->
        </div>
      </div>

      <!-- Column 3: Done -->
      <div class="bg-slate-100 rounded-2xl p-4 border border-slate-200 flex flex-col min-h-[500px]">
        <div class="flex items-center justify-between mb-3 px-1">
          <div class="flex items-center space-x-2">
            <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
            <h2 class="font-semibold text-slate-800 text-sm tracking-wide uppercase">Done</h2>
          </div>
          <span id="badgeDone" class="bg-slate-200 text-slate-700 text-xs font-bold px-2 py-0.5 rounded-full">0</span>
        </div>

        <div
          id="column-done"
          data-status="done"
          class="column-dropzone flex-1 space-y-3 p-1 rounded-xl transition border-2 border-transparent border-dashed min-h-[400px]"
        >
          <!-- Tasks injected here -->
        </div>
      </div>

    </div>
  </main>

  <!-- Create / Edit Task Modal -->
  <div id="taskModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 transform transition-all">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-4">
        <h3 id="modalTitle" class="text-lg font-bold text-slate-900">Create New Task</h3>
        <button id="closeModalBtn" class="text-slate-400 hover:text-slate-600 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <form id="taskForm" class="space-y-4">
        <input type="hidden" id="taskId" />

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Title *</label>
          <input
            id="taskTitleInput"
            type="text"
            required
            placeholder="e.g., Build authentication module"
            class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Description</label>
          <textarea
            id="taskDescInput"
            rows="3"
            placeholder="Optional detailed description..."
            class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
          ></textarea>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Status</label>
            <select
              id="taskStatusInput"
              class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
            >
              <option value="todo">To Do</option>
              <option value="in-progress">In Progress</option>
              <option value="done">Done</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Priority</label>
            <select
              id="taskPriorityInput"
              class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
            >
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Card Accent Color</label>
          <div class="flex items-center space-x-3">
            <input
              id="taskColorInput"
              type="color"
              value="#3b82f6"
              class="w-10 h-10 p-1 border border-slate-300 rounded-lg cursor-pointer"
            />
            <span id="colorHexLabel" class="text-xs font-mono text-slate-500">#3b82f6</span>
          </div>
        </div>

        <div class="flex justify-end space-x-3 pt-4 border-t border-slate-100">
          <button
            type="button"
            id="cancelModalBtn"
            class="px-4 py-2 text-sm font-medium text-slate-600 hover:text-slate-800 bg-slate-100 hover:bg-slate-200 rounded-lg transition"
          >
            Cancel
          </button>
          <button
            type="submit"
            class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg transition shadow"
          >
            Save Task
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="fixed bottom-5 right-5 space-y-2 z-50"></div>

  <!-- JavaScript Frontend Logic -->
  <script>
    const API_BASE = '/api';
    let allTasks = [];
    let draggedTaskId = null;

    // Toast Alert Helper
    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      const bg = type === 'error' ? 'bg-rose-600' : 'bg-slate-900';
      toast.className = `${bg} text-white text-sm px-4 py-2.5 rounded-xl shadow-lg flex items-center space-x-2 transition transform duration-200 ease-out`;
      toast.innerHTML = `<span>${type === 'error' ? '⚠️' : '✓'}</span><span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 200);
      }, 3000);
    }

    // Fetch and render all tasks
    async function loadTasks() {
      try {
        const res = await fetch(`${API_BASE}/tasks`);
        if (!res.ok) throw new Error('Failed to fetch tasks');
        allTasks = await res.json();
        renderBoard();
        loadStats();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    // Fetch stats
    async function loadStats() {
      try {
        const res = await fetch(`${API_BASE}/stats`);
        if (!res.ok) return;
        const stats = await res.json();
        document.getElementById('statTotal').innerText = stats.total;
        document.getElementById('statTodo').innerText = stats.by_status.todo || 0;
        document.getElementById('statInProgress').innerText = stats.by_status['in-progress'] || 0;
        document.getElementById('statDone').innerText = stats.by_status.done || 0;
        document.getElementById('badgeTodo').innerText = stats.by_status.todo || 0;
        document.getElementById('badgeInProgress').innerText = stats.by_status['in-progress'] || 0;
        document.getElementById('badgeDone').innerText = stats.by_status.done || 0;
      } catch (err) {
        console.error('Stats error:', err);
      }
    }

    // Render board cards
    function renderBoard() {
      const todoCol = document.getElementById('column-todo');
      const inProgCol = document.getElementById('column-in-progress');
      const doneCol = document.getElementById('column-done');

      todoCol.innerHTML = '';
      inProgCol.innerHTML = '';
      doneCol.innerHTML = '';

      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const priorityFilter = document.getElementById('priorityFilter').value;

      const filtered = allTasks.filter(task => {
        const matchSearch = task.title.toLowerCase().includes(query) || (task.description && task.description.toLowerCase().includes(query));
        const matchPriority = priorityFilter === 'all' || task.priority === priorityFilter;
        return matchSearch && matchPriority;
      });

      filtered.forEach(task => {
        const card = createTaskCard(task);
        if (task.status === 'in-progress') {
          inProgCol.appendChild(card);
        } else if (task.status === 'done') {
          doneCol.appendChild(card);
        } else {
          todoCol.appendChild(card);
        }
      });
    }

    // Create Card DOM Element
    function createTaskCard(task) {
      const card = document.createElement('div');
      card.id = `task-${task.id}`;
      card.draggable = true;
      card.className = 'task-card bg-white rounded-xl p-4 border border-slate-200 shadow-sm relative group';
      card.style.borderLeft = `5px solid ${task.color || '#3b82f6'}`;

      const priorityBadges = {
        high: '<span class="bg-rose-50 text-rose-700 text-xs font-semibold px-2 py-0.5 rounded-md border border-rose-200">High</span>',
        medium: '<span class="bg-amber-50 text-amber-700 text-xs font-semibold px-2 py-0.5 rounded-md border border-amber-200">Medium</span>',
        low: '<span class="bg-emerald-50 text-emerald-700 text-xs font-semibold px-2 py-0.5 rounded-md border border-emerald-200">Low</span>',
      };

      const dateStr = task.created_at ? new Date(task.created_at).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : '';

      card.innerHTML = `
        <div class="flex items-start justify-between">
          <h4 class="font-semibold text-slate-800 text-sm leading-snug flex-1 mr-2">${escapeHtml(task.title)}</h4>
          <div class="opacity-0 group-hover:opacity-100 transition flex items-center space-x-1">
            <button onclick="openEditModal('${task.id}')" title="Edit Task" class="text-slate-400 hover:text-indigo-600 p-1">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
            </button>
            <button onclick="deleteTask('${task.id}')" title="Delete Task" class="text-slate-400 hover:text-rose-600 p-1">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            </button>
          </div>
        </div>
        ${task.description ? `<p class="text-xs text-slate-500 mt-2 line-clamp-2 leading-relaxed">${escapeHtml(task.description)}</p>` : ''}
        <div class="flex items-center justify-between mt-3 pt-2 border-t border-slate-100 text-xs">
          <div>${priorityBadges[task.priority] || ''}</div>
          <span class="text-slate-400 font-medium">${dateStr}</span>
        </div>
      `;

      // Drag events
      card.addEventListener('dragstart', (e) => {
        draggedTaskId = task.id;
        card.classList.add('dragging');
        e.dataTransfer.setData('text/plain', task.id);
      });

      card.addEventListener('dragend', () => {
        card.classList.remove('dragging');
        draggedTaskId = null;
      });

      return card;
    }

    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.innerText = str;
      return div.innerHTML;
    }

    // Setup Dropzones
    document.querySelectorAll('.column-dropzone').forEach(dropzone => {
      dropzone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropzone.classList.add('drag-over');
      });

      dropzone.addEventListener('dragleave', () => {
        dropzone.classList.remove('drag-over');
      });

      dropzone.addEventListener('drop', async (e) => {
        e.preventDefault();
        dropzone.classList.remove('drag-over');
        const taskId = e.dataTransfer.getData('text/plain') || draggedTaskId;
        const newStatus = dropzone.dataset.status;

        if (taskId && newStatus) {
          const task = allTasks.find(t => t.id === taskId);
          if (task && task.status !== newStatus) {
            // Optimistic update
            task.status = newStatus;
            renderBoard();

            try {
              const res = await fetch(`${API_BASE}/tasks/${taskId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus }),
              });
              if (!res.ok) throw new Error('Status update failed');
              showToast(`Moved to ${newStatus.replace('-', ' ')}`);
              loadStats();
            } catch (err) {
              showToast(err.message, 'error');
              loadTasks(); // Revert
            }
          }
        }
      });
    });

    // Delete Task
    async function deleteTask(taskId) {
      if (!confirm('Are you sure you want to delete this task?')) return;
      try {
        const res = await fetch(`${API_BASE}/tasks/${taskId}`, { method: 'DELETE' });
        if (!res.ok) throw new Error('Failed to delete task');
        showToast('Task deleted successfully');
        loadTasks();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    // Modal Handling
    const modal = document.getElementById('taskModal');
    const form = document.getElementById('taskForm');
    const colorInput = document.getElementById('taskColorInput');
    const colorLabel = document.getElementById('colorHexLabel');

    colorInput.addEventListener('input', () => {
      colorLabel.innerText = colorInput.value;
    });

    document.getElementById('openCreateModalBtn').addEventListener('click', () => {
      document.getElementById('modalTitle').innerText = 'Create New Task';
      form.reset();
      document.getElementById('taskId').value = '';
      colorInput.value = '#3b82f6';
      colorLabel.innerText = '#3b82f6';
      modal.classList.remove('hidden');
    });

    function openEditModal(taskId) {
      const task = allTasks.find(t => t.id === taskId);
      if (!task) return;
      document.getElementById('modalTitle').innerText = 'Edit Task';
      document.getElementById('taskId').value = task.id;
      document.getElementById('taskTitleInput').value = task.title;
      document.getElementById('taskDescInput').value = task.description || '';
      document.getElementById('taskStatusInput').value = task.status;
      document.getElementById('taskPriorityInput').value = task.priority;
      colorInput.value = task.color || '#3b82f6';
      colorLabel.innerText = colorInput.value;
      modal.classList.remove('hidden');
    }

    function closeModal() {
      modal.classList.add('hidden');
      form.reset();
    }

    document.getElementById('closeModalBtn').addEventListener('click', closeModal);
    document.getElementById('cancelModalBtn').addEventListener('click', closeModal);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('taskId').value;
      const payload = {
        title: document.getElementById('taskTitleInput').value.trim(),
        description: document.getElementById('taskDescInput').value.trim(),
        status: document.getElementById('taskStatusInput').value,
        priority: document.getElementById('taskPriorityInput').value,
        color: colorInput.value,
      };

      try {
        const url = id ? `${API_BASE}/tasks/${id}` : `${API_BASE}/tasks`;
        const method = id ? 'PUT' : 'POST';
        const res = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error || 'Operation failed');
        }

        closeModal();
        showToast(id ? 'Task updated' : 'Task created');
        loadTasks();
      } catch (err) {
        showToast(err.message, 'error');
      }
    });

    // Search and Filter Listeners
    document.getElementById('searchInput').addEventListener('input', renderBoard);
    document.getElementById('priorityFilter').addEventListener('change', renderBoard);

    // Initial Load
    loadTasks();
  </script>
</body>
</html>
