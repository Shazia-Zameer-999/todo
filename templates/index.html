<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f7f5" />
    <title>Taskflow | Team workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <header class="app-header">
      <div class="header-content">
        <div class="header-left">
          <a class="brand" href="/" aria-label="Taskflow home">
            <span class="brand-logo" aria-hidden="true">◈</span>
            <span class="brand-text"
              ><strong class="brand-title">Taskflow</strong
              ><span class="brand-tagline">Calm work, shipped well.</span></span
            >
          </a>
          <div class="stats-bar" aria-label="Task summary">
            <span class="stat-pill"
              ><span class="stat-dot dot-todo"></span
              ><span class="stat-label">To do</span
              ><b class="stat-value" id="stat-todo">0</b></span
            >
            <span class="stat-divider"></span>
            <span class="stat-pill"
              ><span class="stat-dot dot-in-progress"></span
              ><span class="stat-label">Active</span
              ><b class="stat-value" id="stat-in-progress">0</b></span
            >
            <span class="stat-divider"></span>
            <span class="stat-pill"
              ><span class="stat-dot dot-done"></span
              ><span class="stat-label">Done</span
              ><b class="stat-value" id="stat-done">0</b></span
            >
          </div>
        </div>
        <div class="header-right">
          <label class="search-box" for="search-input"
            ><span aria-hidden="true">⌕</span
            ><input
              id="search-input"
              type="search"
              placeholder="Search your workspace"
              autocomplete="off"
            /><kbd>⌘ K</kbd></label
          >
          <select
            id="priority-filter"
            class="form-select compact-select"
            aria-label="Filter by priority"
          >
            <option value="all">All priorities</option>
            <option value="high">High priority</option>
            <option value="medium">Medium priority</option>
            <option value="low">Low priority</option>
          </select>
          <button
            class="btn-icon theme-toggle"
            id="theme-toggle"
            type="button"
            title="Toggle theme"
            aria-label="Toggle theme"
          >
            <span id="theme-icon" class="theme-icon-display">☾</span>
          </button>
          <button class="btn btn-primary" id="btn-add-task" type="button">
            <span aria-hidden="true">+</span> New task
          </button>
        </div>
      </div>
    </header>

    <main class="board-wrapper">
      <section class="workspace-intro" aria-labelledby="workspace-title">
        <div>
          <p class="eyebrow">Monday, October 13, 2026</p>
          <h1 id="workspace-title">Your team workspace</h1>
          <p class="intro-copy">
            A clear view of what is next, what is moving, and what is complete.
          </p>
        </div>
        <div class="workspace-health">
          <span class="health-dot"></span><span>Workspace synced</span
          ><strong id="stat-total">0</strong><span>tasks</span>
        </div>
      </section>
      <section class="board-container" aria-label="Task board">
        <article class="kanban-column" data-status="todo">
          <header class="column-header">
            <div class="column-title-group">
              <span class="column-indicator indicator-todo"></span>
              <h2 class="column-title">To do</h2>
              <span id="count-todo" class="column-count">0</span>
            </div>
            <button
              class="btn-column-add"
              data-status="todo"
              type="button"
              title="Add to To do"
              aria-label="Add to To do"
            >
              +
            </button>
          </header>
          <div id="list-todo" class="task-list" data-status="todo"></div>
        </article>
        <article class="kanban-column" data-status="in-progress">
          <header class="column-header">
            <div class="column-title-group">
              <span class="column-indicator indicator-in-progress"></span>
              <h2 class="column-title">In progress</h2>
              <span id="count-in-progress" class="column-count">0</span>
            </div>
            <button
              class="btn-column-add"
              data-status="in-progress"
              type="button"
              title="Add to In progress"
              aria-label="Add to In progress"
            >
              +
            </button>
          </header>
          <div
            id="list-in-progress"
            class="task-list"
            data-status="in-progress"
          ></div>
        </article>
        <article class="kanban-column" data-status="done">
          <header class="column-header">
            <div class="column-title-group">
              <span class="column-indicator indicator-done"></span>
              <h2 class="column-title">Done</h2>
              <span id="count-done" class="column-count">0</span>
            </div>
            <button
              class="btn-column-add"
              data-status="done"
              type="button"
              title="Add to Done"
              aria-label="Add to Done"
            >
              +
            </button>
          </header>
          <div id="list-done" class="task-list" data-status="done"></div>
        </article>
      </section>
    </main>

    <div
      id="task-modal"
      class="modal-overlay hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
    >
      <div class="modal-card">
        <header class="modal-header">
          <h2 id="modal-title" class="modal-title">Add new task</h2>
          <button
            id="modal-close-btn"
            class="btn-close"
            type="button"
            aria-label="Close"
          >
            ×
          </button>
        </header>
        <form id="task-form" class="modal-form">
          <input id="task-id" type="hidden" />
          <div class="form-group">
            <label class="form-label" for="task-title"
              >Task title <span class="required-star">*</span></label
            ><input
              id="task-title"
              class="form-input"
              type="text"
              maxlength="120"
              required
              placeholder="What needs to happen?"
            /><span id="title-error" class="form-error"></span>
          </div>
          <div class="form-group">
            <label class="form-label" for="task-desc">Description</label
            ><textarea
              id="task-desc"
              class="form-textarea"
              rows="3"
              maxlength="600"
              placeholder="Add context, links, or a definition of done"
            ></textarea>
          </div>
          <div class="form-row">
            <div class="form-group flex-1">
              <label class="form-label" for="task-status">Status</label
              ><select id="task-status" class="form-select">
                <option value="todo">To do</option>
                <option value="in-progress">In progress</option>
                <option value="done">Done</option>
              </select>
            </div>
            <div class="form-group flex-1">
              <label class="form-label" for="task-priority">Priority</label
              ><select id="task-priority" class="form-select">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group flex-1">
              <label class="form-label" for="task-assignee">Assignee</label
              ><input
                id="task-assignee"
                class="form-input"
                type="text"
                maxlength="80"
                placeholder="e.g. Maya"
              />
            </div>
            <div class="form-group flex-1">
              <label class="form-label" for="task-due-date">Due date</label
              ><input id="task-due-date" class="form-input" type="date" />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="task-tags">Tags</label
            ><input
              id="task-tags"
              class="form-input"
              type="text"
              placeholder="design, frontend, launch"
            />
          </div>
          <div class="form-group">
            <label class="form-label">Accent color</label>
            <div class="color-picker-group">
              <div id="color-swatches" class="color-swatches">
                <button
                  class="color-swatch"
                  type="button"
                  data-color="#3b82f6"
                  style="background: #3b82f6"
                  aria-label="Blue"
                ></button
                ><button
                  class="color-swatch"
                  type="button"
                  data-color="#ef4444"
                  style="background: #ef4444"
                  aria-label="Red"
                ></button
                ><button
                  class="color-swatch"
                  type="button"
                  data-color="#10b981"
                  style="background: #10b981"
                  aria-label="Green"
                ></button
                ><button
                  class="color-swatch"
                  type="button"
                  data-color="#8b5cf6"
                  style="background: #8b5cf6"
                  aria-label="Purple"
                ></button
                ><button
                  class="color-swatch"
                  type="button"
                  data-color="#f59e0b"
                  style="background: #f59e0b"
                  aria-label="Amber"
                ></button>
              </div>
              <div class="custom-color-wrapper">
                <input
                  id="task-color"
                  class="color-input"
                  type="color"
                  value="#3b82f6"
                /><span id="color-hex-label" class="custom-color-label"
                  >#3B82F6</span
                >
              </div>
            </div>
          </div>
          <footer class="modal-footer">
            <button id="btn-cancel" class="btn btn-secondary" type="button">
              Cancel</button
            ><button class="btn btn-primary" type="submit">
              <span id="btn-submit-text">Create task</span>
            </button>
          </footer>
        </form>
      </div>
    </div>
    <div
      id="delete-modal"
      class="modal-overlay hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="delete-modal-title"
    >
      <div class="modal-card modal-card-sm">
        <header class="modal-header">
          <h2 id="delete-modal-title" class="modal-title delete-title">
            Delete task?
          </h2>
          <button
            id="delete-modal-close-btn"
            class="btn-close"
            type="button"
            aria-label="Close"
          >
            ×
          </button>
        </header>
        <div class="modal-body">
          <p class="delete-message">
            This will permanently remove
            <strong id="delete-task-title"></strong>.
          </p>
        </div>
        <footer class="modal-footer">
          <button
            id="btn-delete-cancel"
            class="btn btn-secondary"
            type="button"
          >
            Keep task</button
          ><button id="btn-delete-confirm" class="btn btn-danger" type="button">
            Delete
          </button>
        </footer>
      </div>
    </div>
    <div id="toast-container" class="toast-container" aria-live="polite"></div>
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
  </body>
</html>
